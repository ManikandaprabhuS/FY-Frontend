.fy-offer-wrap {max-width:1440px;margin:16px auto 0;padding:0 20px;}

.fy-offer-banner__subtext {margin-top:7px;font-size:clamp(12px,1.5vw,17px);line-height:1.4;}
.fy-offer-banner__shop {display:inline-flex;min-height:44px;align-items:center;gap:12px;margin-top:12px;padding:8px 18px;border-radius:999px;background:#0b0b0b;color:#fff;font-size:12px;font-weight:700;transition:background-color 250ms ease,color 250ms ease,box-shadow 250ms ease;}
@media(hover:hover){.fy-offer-banner__shop:hover{background:#ffffff;color:#0b0b0b;box-shadow:inset 0 0 0 1px #0b0b0b;}}
.fy-offer-banner__shop:focus-visible {outline:3px solid #101010;outline-offset:4px;}
.fy-offer-banner__art {position:absolute;inset:0 0 0 auto;z-index:0;width:48%;height:100%;opacity:.65;}
.fy-offer-banner::after {content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,transparent 45%,rgba(247,247,246,.5) 64%,transparent 85%);}
.fy-offer-skeleton {height:168px;min-height:168px;border-radius:20px;background:#eeeeec;animation:fy-offer-pulse 1.5s ease-in-out infinite;}
@keyframes fy-offer-pulse {50%{opacity:.6;}}
@media(min-width:640px){.fy-offer-wrap{margin-top:24px;padding:0 32px;}.fy-offer-banner__shop{margin-top:15px;}.fy-offer-banner,.fy-offer-skeleton{height:220px;min-height:220px;}.fy-offer-banner__copy{padding:28px 36px;max-width:60%;}.fy-offer-banner__art{width:57%;opacity:1;}.fy-offer-banner__label{font-size:12px;}}
@media(min-width:1024px){.fy-offer-wrap{padding:0 40px;}}
@media(prefers-reduced-motion:reduce){.fy-offer-skeleton{animation:none;}}
/* Uploaded artwork uses the existing art area; all banner/text geometry stays unchanged. */
.fy-offer-banner__image {position:absolute;inset:0 0 0 auto;width:48%;height:100%;overflow:hidden;border-radius:inherit;z-index:0;}
.fy-offer-banner__image img {display:block;width:100%;height:100%;object-fit:cover;object-position:center;aspect-ratio:3/1;}
.fy-offer-banner__image::after {content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#f7f7f6 0%,rgba(247,247,246,.92) 17%,rgba(247,247,246,.35) 40%,transparent 65%);}
@media(min-width:640px){.fy-offer-banner__image{width:57%;}}
